<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MSSL Member Menu</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND VIDEO
        ========================= */

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.60);
            z-index: -2;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 45px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 12px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }

        .header p {
            font-size: 1.1rem;
            color: #d1d5db;
        }

        /* =========================
           MENU
        ========================= */

        .menu {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .menu-card {
            text-decoration: none;
            color: white;
            padding: 45px 25px;
            min-height: 230px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.20);

            backdrop-filter: blur(12px);

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
        }

        .menu-card:hover {
            transform: translateY(-8px);

            background: rgba(255, 255, 255, 0.20);

            box-shadow:
                0 25px 55px rgba(0, 0, 0, 0.5);
        }

        /* =========================
           ICONS
        ========================= */

        .icon {
            width: 85px;
            height: 85px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #5eead4;
            color: #111827;

            font-size: 40px;

            margin-bottom: 22px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .menu-card h2 {
            font-size: 1.45rem;
            margin-bottom: 10px;
        }

        .menu-card p {
            color: #d1d5db;
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: center;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 45px;
            color: #d1d5db;
            font-size: 0.85rem;
            text-align: center;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            .menu {
                grid-template-columns: 1fr;
                max-width: 450px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .menu-card {
                min-height: 200px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         BACKGROUND VIDEO
    ========================= -->

    <video
        class="video-background"
        autoplay
        muted
        loop
        playsinline
    >

        <source
            src="me.mp4"
            type="video/mp4"
        >

        Your browser does not support background video.

    </video>

    <div class="overlay"></div>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <div class="container">

        <div class="header">

            <h1>MSSL Member Portal</h1>

            <p>
                Welcome. Please select an option below.
            </p>

        </div>


        <div class="menu">


            <!-- =========================
                 1. ABOUT MSSL
            ========================= -->

            <a
                href="about.html"
                class="menu-card"
            >

                <div class="icon">
                    ℹ️
                </div>

                <h2>
                    About MSSL
                </h2>

                <p>
                    Learn more about MSSL, the company,
                    and what we do.
                </p>

            </a>


            <!-- =========================
                 2. CLOCKING SYSTEM
            ========================= -->

            <a
                href="https://tractech.motherson.com/WebRegisterE-view/eLogin.aspx"
                class="menu-card"
            >

                <div class="icon">
                    🕐
                </div>

                <h2>
                    Visit Clocking System
                </h2>

                <p>
                    Access the MSSL employee clocking
                    system.
                </p>

            </a>


            <!-- =========================
                 3. OUR CARS
            ========================= -->

            <a
                href="cars.html"
                class="menu-card"
            >

                <div class="icon">
                    🚗
                </div>

                <h2>
                    Our Cars
                </h2>

                <p>
                    Explore our cars and discover
                    what we have available.
                </p>

            </a>


        </div>


        <div class="footer">

            MSSL Member Portal

        </div>

    </div>

</body>
</html>
